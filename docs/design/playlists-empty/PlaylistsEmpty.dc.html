<style>

<div style="min-height: 100vh; background: #0B0C0E; color: #EDEEF0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px">

  <header style="height: 64px; border-bottom: 1px solid #24262B; background: #0B0C0E">
    <div style="max-width: 1280px; height: 100%; margin: 0 auto; padding: 0 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="Playlists.dc.html" style="display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em">
        <span aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, 8px); gap: 2px">
          <span style="width: 8px; height: 8px; border-radius: 2px; background: #EDEEF0"></span>
          <span style="width: 8px; height: 8px; border-radius: 2px; background: #EDEEF0"></span>
          <span style="width: 8px; height: 8px; border-radius: 2px; background: #EDEEF0"></span>
          <span style="width: 8px; height: 8px; border-radius: 2px; background: #F2C35E"></span>
        </span>
        Songify
      </a>
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="display: flex; align-items: center; gap: 8px; color: #B6BAC2; font-size: 13px">
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #24262B; color: #D6D8DD; display: grid; place-items: center; font-size: 12px; font-weight: 600">A</span>
          ahmed
        </div>
        <span aria-hidden="true" style="width: 1px; height: 20px; background: #24262B"></span>
        <a class="btn-ghost" href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 6px; color: #B6BAC2; font-size: 13px; font-weight: 500">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"></path></svg>
          Sign out
        </a>
      </div>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 80px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em">Your playlists</h1>
      <p style="margin: 0; color: #8E939D; font-size: 13px; line-height: 18px">0 playlists</p>
    </div>

    <section style="display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 96px 24px; border: 1px dashed #2E3137; border-radius: 12px; text-align: center">
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, 44px); gap: 6px">
        <span style="width: 44px; height: 44px; border-radius: 6px; border: 1px dashed #444851; box-sizing: border-box"></span>
        <span style="width: 44px; height: 44px; border-radius: 6px; border: 1px dashed #444851; box-sizing: border-box"></span>
        <span style="width: 44px; height: 44px; border-radius: 6px; border: 1px dashed #444851; box-sizing: border-box"></span>

      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; max-width: 360px">
        <h2 style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 600">No playlists yet</h2>
        <p style="margin: 0; color: #8E939D; text-wrap: pretty">Create one, then add songs from the shared catalog. Its cover fills in from the album art.</p>
      </div>
      <button class="btn-primary" type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 12px; border: 0; border-radius: 6px; background: #F2C35E; color: #1A1406; font-size: 14px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>

    </section>
  </main>
</div>
</x-dc>
