services:
  postgres:
    image: postgres:17-alpine
    container_name: songify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: songify
      POSTGRES_PASSWORD: songify_dev_password
      POSTGRES_DB: songify
    ports:
      - "5432:5432"
    volumes:
      - songify-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songify -d songify"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  songify-data: